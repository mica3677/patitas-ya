<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Generador de ilusiones</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap">
<style>
  :root{--bg:#111;--panel:#1b1b1b;--fg:#eee;--mut:#999;--ac:#fff;--line:#333;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));justify-content:center;align-items:flex-start}
  .stage{flex:0 1 360px;min-width:0;display:flex;justify-content:center}
  canvas{width:min(100%,calc(62vh*9/16));max-width:100%;aspect-ratio:9/16;background:#000;border-radius:8px;display:block}
  .panel{flex:1 1 300px;min-width:0;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
  h1{font-size:18px;margin:0 0 12px}
  label{display:block;margin:12px 0 4px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  label span{float:right;color:var(--fg)}
  select,input[type=text]{width:100%;background:#000;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
  input[type=range]{width:100%;height:32px}
  select,input[type=text]{font-size:16px}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  .presets button{flex:0 0 auto;padding:6px 10px;font-size:13px;font-weight:500;background:#000;color:var(--fg);border:1px solid var(--line);border-left-width:14px}
  .colors{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
  .colors label{margin:8px 0 0}
  input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;background:#000;padding:2px}
  #pedido{width:100%;margin-top:12px;background:#000;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.5 ui-monospace,Menlo,monospace;resize:none}
  #out{margin-top:12px}
  #out video{width:100%;max-height:60vh;border-radius:6px;background:#000}
  #out p{margin:6px 0 0;color:var(--mut);font-size:12px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  button{flex:1 1 120px;background:var(--ac);color:#000;border:0;border-radius:6px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
  button.sec{background:#333;color:var(--fg)}
  button:disabled{opacity:.5;cursor:default}
  .chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--fg)}
  #msg{margin-top:10px;color:var(--mut);font-size:12px;min-height:1.4em}
</style>
</head>
<body>
<div class="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div class="panel">
  <h1>Generador de ilusiones de giro</h1>
  <label>Forma</label>
  <select id="shape">
    <option value="sphere">Esfera (malla de puntos)</option>
    <option value="cylinder">Cilindro (puntos al azar)</option>
    <option value="torus">Toro (dona)</option>
        <option value="cone">Cono</option>
    <option value="pyramid">Pirámide</option>
        <option value="coneInv">Cono invertido</option>
    <option value="galaxy">Galaxia espiral</option>
    <option value="tornado">Tornado</option>
        <option value="saturn">Saturno</option>
    <option value="blackHole">Agujero negro</option>
    <option value="pumpkin">Calabaza</option>
    <option value="hourglass">Reloj de arena</option>
        <option value="moon">Luna con cráteres</option>
    <option value="tesseract">Hipercubo (teseracto)</option>
    <option value="coil">Bobina toroidal</option>
    <option value="sierpinski">Fractal Sierpinski</option>
        <option value="football">Balón de fútbol americano</option>
    <option value="basketball">Pelota de básquet</option>
    <option value="soccer">Pelota de fútbol (soccer)</option>
    <option value="ufo">OVNI</option>
    <option value="rocket">Cohete</option>
    <option value="star">Estrella 3D (5 puntas)</option>

    <option value="flag">Bandera de EE. UU.</option>
    <option value="snowman">Muñeco de nieve</option>
    <option value="candyCane">Bastón de caramelo</option>
    <option value="dice">Dado</option>
    <option value="coin">Moneda de oro ($)</option>
        <option value="cube">Cubo cortado (dos colores)</option>
    <option value="fibSphere">Esfera uniforme</option>
    <option value="jellyfish">Medusa</option>
    <option value="butterfly">Mariposa</option>
    <option value="world">Planeta</option>
    <option value="oak">Árbol (fractal)</option>
    <option value="comet">Cometa</option>
    <option value="nebula">Nebulosa</option>
    <option value="plasma">Esfera de plasma</option>
    <option value="burst">Explosión de estrellas</option>
            <option value="cubeSplit">Cubo partido en dos</option>
    <option value="sphereDiag">Esfera partida en diagonal</option>
    <option value="torusSplit">Toro partido en dos</option>
    <option value="coneSplit">Cono partido en dos</option>
    <option value="cylSplit">Cilindro partido en dos</option>
    <option value="halvesCounter">Mitades que giran al revés</option>
    <option value="shellsCounter">Esferas que giran al revés</option>
    <option value="cubesCounter">Cubos que giran al revés</option>
    <option value="slices">Rodajas que giran al revés</option>
    <option value="halves">Esfera partida en dos</option>
    <option value="bowls">Cuencos cruzados</option>
    <option value="cutplanet">Planeta cortado (capas)</option>
    <option value="slicedTorus">Toro cortado</option>
    <option value="cubeDots">Cubo de puntos</option>
    <option value="cubeSphere">Esfera dentro de un cubo</option>
    <option value="voxels">Cubo de cubitos (ajedrez)</option>
    <option value="nestedCones">Conos anidados</option>
    <option value="helix">Hélice doble (ADN)</option>
  </select>
  <label>Cantidad de puntos <span id="vN"></span></label>
  <input type="range" id="n" min="300" max="9000" step="100" value="2500">
  <label>Tamaño del punto <span id="vS"></span></label>
  <input type="range" id="s" min="1" max="8" step="0.5" value="3">
  <label>Velocidad (vueltas/min) <span id="vV"></span></label>
  <input type="range" id="v" min="2" max="40" step="1" value="12">
  <label>Inclinación de cámara <span id="vT"></span></label>
  <input type="range" id="t" min="0" max="45" step="1" value="15">
  <label>Pista de profundidad <span id="vD"></span></label>
  <input type="range" id="d" min="0" max="100" step="5" value="0">
  <label>Tamaño de la figura <span id="vZ"></span></label>
  <input type="range" id="z" min="20" max="60" step="1" value="42">
  <label for="word">Palabra (para Texto 3D)</label>
  <input type="text" id="word" value="USA" maxlength="14">
  <label>Brillo (glow) <span id="vB"></span></label>
  <input type="range" id="b" min="0" max="100" step="5" value="0">
  <label>Estrellas de fondo <span id="vE"></span></label>
  <input type="range" id="e" min="0" max="600" step="20" value="0">
  <label>Paleta</label>
  <div id="presets" class="presets"></div>
  <div class="colors">
    <div><label for="cbg">Fondo</label><input type="color" id="cbg" value="#000000"></div>
    <div><label for="ctt">Texto</label><input type="color" id="ctt" value="#ffffff"></div>
    <div><label for="ca">Puntos (arriba)</label><input type="color" id="ca" value="#ffffff"></div>
    <div><label for="cb">Puntos (abajo)</label><input type="color" id="cb" value="#ffffff"></div>
  </div>
  <div class="chk"><input type="checkbox" id="grad"><label for="grad" style="margin:0;color:inherit;text-transform:none;font-size:14px">Degradado de arriba a abajo</label></div>
  <label>Texto de arriba</label>
  <input type="text" id="top" value="¿Puedes invertir el giro solo con tu mente?">
  <label>Texto de abajo</label>
  <input type="text" id="bot" value="SÍGUEME SI LO LOGRASTE.">
  <label>Duración del video (s) <span id="vR"></span></label>
  <input type="range" id="r" min="5" max="30" step="1" value="15">
  <div class="chk"><input type="checkbox" id="rev"><label for="rev" style="margin:0;color:inherit;text-transform:none;font-size:14px">Girar al revés</label></div>
  <div class="row">
    <button id="rnd" class="sec">Sorpréndeme</button>
    <button id="reseed" class="sec">Nueva versión</button>
    <button id="rec">Copiar pedido</button>
  </div>
  <textarea id="pedido" readonly hidden></textarea>
  <div id="msg">Elegí todo a tu gusto, tocá Copiar pedido y pegámelo en el chat. Yo genero el video en calidad completa (1080x1920, sin pérdida visible).</div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let pts = [], t0 = performance.now(), angle = 0, last = t0, recording = false;

// generador con semilla para que "nueva versión" cambie los puntos al azar
let seed = 1;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const gauss = () => Math.sqrt(-2*Math.log(rnd() + 1e-9)) * Math.cos(2*Math.PI*rnd());
function edgeShape(n, v, e){
  const out = [];
  for (let i = 0; i < n; i++){ const [a,b] = e[Math.floor(rnd()*e.length)], u = rnd();
    out.push([0,1,2].map(k => v[a][k] + (v[b][k]-v[a][k])*u)); }
  return out;
}

function tri(u, v, A, B, C){
  const d = (p, q, r) => (p[0]-r[0])*(q[1]-r[1]) - (q[0]-r[0])*(p[1]-r[1]), P = [u, v],
    d1 = d(P,A,B), d2 = d(P,B,C), d3 = d(P,C,A);
  return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
}
// cara tallada en coordenadas (u = ángulo desde el frente, v = altura -1..1 sobre la calabaza): true = agujero
function carvedFace(u, v){
  if (tri(u,v,[-.62,.12],[-.22,.12],[-.42,.44]) || tri(u,v,[.22,.12],[.62,.12],[.42,.44]) || tri(u,v,[-.1,-.04],[.1,-.04],[0,.12])) return true;
  if (Math.abs(u) < .8){ const yc = -.38 + .35*(u/.8)**2, k = Math.floor((u+.8)/.16);
    if (Math.abs(v - yc) < .12) return !(k % 2 ? v > yc : v < yc);      // dientes alternados arriba y abajo
  }
  return false;
}

const norm3 = v => { const l = Math.hypot(...v) || 1; return v.map(c => c/l); };
function glyphs(txt, maxW, maxH){           // letras a puntos: devuelve [x, y, esBorde] centrado y escalado a maxW x maxH
  const CW = 1200, CH = 400, cv = document.createElement('canvas'); cv.width = CW; cv.height = CH;
  const g = cv.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, CW, CH); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  let fs = 300; g.font = '800 ' + fs + 'px Poppins, sans-serif'; const tw = g.measureText(txt).width;
  if (tw > 1100){ fs = fs*1100/tw; g.font = '800 ' + fs + 'px Poppins, sans-serif'; }
  g.fillText(txt, CW/2, CH/2 + 15);
  const d = g.getImageData(0, 0, CW, CH).data, ON = (x, y) => x >= 0 && y >= 0 && x < CW && y < CH && d[(y*CW + x)*4] > 128, all = [];
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let y = 0; y < CH; y += 2) for (let x = 0; x < CW; x += 2) if (ON(x, y)){
    all.push([x, y, !ON(x-3, y) || !ON(x+3, y) || !ON(x, y-3) || !ON(x, y+3)]); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  if (!all.length) return [];
  const sc = Math.min(maxW/(x1 - x0 || 1), maxH/(y1 - y0 || 1)), cx = (x0 + x1)/2, cy = (y0 + y1)/2;
  return all.map(p => [(p[0] - cx)*sc, -(p[1] - cy)*sc, p[2]]);
}
const shapes = {
  sphere(n){
    // meridianos y paralelos hechos de puntos, como en el video
    const out = [], M = 12, P = 9;
    for (let i = 0; i < n; i++){
      if (i % 2){ const m = Math.floor(rnd()*M), th = rnd()*Math.PI;
        const a = m/M*2*Math.PI; out.push([Math.sin(th)*Math.cos(a), Math.cos(th), Math.sin(th)*Math.sin(a)]);
      } else { const p = 1 + Math.floor(rnd()*P), th = p/(P+1)*Math.PI, a = rnd()*2*Math.PI;
        out.push([Math.sin(th)*Math.cos(a), Math.cos(th), Math.sin(th)*Math.sin(a)]);
      }
    }
    return out;
  },
  cylinder(n){
    const out = [];
    for (let i = 0; i < n; i++){
      const a = rnd()*2*Math.PI, y = rnd()*2 - 1;
      out.push([Math.cos(a)*0.55, y*0.95, Math.sin(a)*0.55]);
    }
    return out;
  },
  torus(n){
    const out = [];
    for (let i = 0; i < n; i++){ const u = rnd()*2*Math.PI, v = rnd()*2*Math.PI, R=.7, r=.28;
      out.push([(R+r*Math.cos(v))*Math.cos(u), r*Math.sin(v), (R+r*Math.cos(v))*Math.sin(u)]); }
    return out;
  },
  cone(n){
    const out = [];
    for (let i = 0; i < n; i++){ const t = Math.sqrt(rnd()), a = rnd()*2*Math.PI;
      out.push([Math.cos(a)*.75*t, 1 - 2*t, Math.sin(a)*.75*t]); }
    return out;
  },
  pyramid(n){ return edgeShape(n, [[-.7,-.8,-.7],[.7,-.8,-.7],[.7,-.8,.7],[-.7,-.8,.7],[0,.95,0]],
    [[0,1],[1,2],[2,3],[3,0],[0,4],[1,4],[2,4],[3,4]]); },
  coneInv(n){ return shapes.cone(n).map(([x,y,z]) => [x,-y,z]); },
  galaxy(n){
    const out = [], b = 2.4, clumps = [], th = r => b*Math.log(r/.08) + .5;     // brazos que nacen en los extremos de la barra
    for (let k = 0; k < 40; k++){ const r = .15 + .8*Math.sqrt(rnd()); clumps.push([r, th(r) + Math.floor(rnd()*2)*Math.PI + gauss()*.08]); }
    for (let i = 0; i < n; i++){ const q = rnd();
      if (q < .15) out.push([gauss()*.13, gauss()*.07, gauss()*.13]);                       // bulbo
      else if (q < .20) out.push([gauss()*.04, gauss()*.03, gauss()*.04]);                   // núcleo brillante
      else if (q < .26){ const al = gauss()*.2, ac = gauss()*.04;                           // barra central
        out.push([al*Math.cos(.5) - ac*Math.sin(.5), gauss()*.025, al*Math.sin(.5) + ac*Math.cos(.5)]); }
      else if (q < .78){ const r = .08 + .92*Math.pow(rnd(), .85), arm = rnd() < .72 ? Math.floor(rnd()*2)*Math.PI : Math.PI/2 + Math.floor(rnd()*2)*Math.PI,   // 2 brazos principales y 2 menores
          a = th(r) + arm + gauss()*(.1 + .1*r);
        out.push([r*Math.cos(a), gauss()*.02*(1.2 - r) + .05*r*r*Math.sin(a), r*Math.sin(a)]); }
      else if (q < .88){ const c = clumps[Math.floor(rnd()*clumps.length)];                  // cúmulos de estrellas jóvenes
        out.push([c[0]*Math.cos(c[1]) + gauss()*.02, gauss()*.012, c[0]*Math.sin(c[1]) + gauss()*.02]); }
      else if (q < .96){ const r = Math.pow(rnd(), .7), a = rnd()*2*Math.PI; out.push([r*Math.cos(a), gauss()*.03*(1.2 - r), r*Math.sin(a)]); }   // disco entre brazos
      else out.push([gauss()*.5, gauss()*.18, gauss()*.5]);                                 // halo
    }
    return out;
  },
  tornado(n){
    const out = [];
    for (let i = 0; i < n; i++){ const y = rnd()*2-1, h = (y+1)/2, rad = (.1 + .72*Math.pow(h,1.6))*(1 + gauss()*.04),
      a = y*5 + Math.floor(rnd()*4)*Math.PI/2 + gauss()*.07;
      out.push([Math.cos(a)*rad, y*.95, Math.sin(a)*rad]); }
    return out;
  },
  saturn(n){
    const out = [];
    for (let i = 0; i < n; i++){
      if (rnd() < .42){ const x = gauss(), y = gauss(), z = gauss(), l = Math.hypot(x,y,z) || 1; out.push([x/l*.5, y/l*.5, z/l*.5]); }
      else { let r; do r = .72 + rnd()*.38; while (r > .92 && r < .96);   // hueco entre anillos
        const a = rnd()*2*Math.PI, px = r*Math.cos(a), t = .4;
        out.push([px*Math.cos(t), px*Math.sin(t) + gauss()*.004, r*Math.sin(a)]); }
    }
    return out;
  },
  blackHole(n){
    // disco de acreción fino (gira) + luz curvada y anillo de fotones fijos en pantalla, como en las imágenes reales
    const out = [];
    for (let i = 0; i < n; i++){ const q = rnd(), a = rnd()*2*Math.PI;
      if (q < .6){ let r, aa, w, t = 0;                         // más denso cerca del borde interior, con tres brazos en espiral
        do { r = .52 + .62*Math.pow(rnd(), 1.9); aa = rnd()*2*Math.PI; w = .5 + .5*Math.cos(3*(aa - 4*Math.log(r/.52))); w = w*w*.8 + .2; } while (rnd() > w && t++ < 60);
        out.push([r*Math.cos(aa), gauss()*.006*(1 + 3*r*r), r*Math.sin(aa)]);
      } else if (q < .67){ const r = .5 + Math.abs(gauss())*.012; out.push([r*Math.cos(a), gauss()*.004, r*Math.sin(a)]);                // borde interior brillante
      } else if (q < .77){ const r = .4 + gauss()*.0035; out.push([r*Math.cos(a), r*Math.sin(a), 0, 1]);                              // anillo de fotones (fijo en pantalla)
      } else if (q < .95){ const ph = (rnd() < .5 ? 1 : -1)*Math.PI/2 + gauss()*.5, r = .41 + Math.pow(rnd(), 1.6)*.2;                // luz curvada del lado lejano del disco
        out.push([r*Math.cos(ph), r*Math.sin(ph), 0, 1]);
      } else { const r = .9 + rnd()*.35; out.push([r*Math.cos(a), gauss()*.03*(r - .5), r*Math.sin(a)]); }                            // polvo exterior
    }
    return out;
  },
  pumpkin(n){
    const out = [], D = .04, body = (c, a) => { const s = Math.sqrt(1-c*c), rr = 1 - .13*(1 - Math.abs(Math.cos(4*a)));   // 8 gajos
      return [s*Math.cos(a)*rr, c*.78, s*Math.sin(a)*rr]; };
    for (let i = 0; i < n; i++){ const q = rnd();
      if (q < .05){ const t = rnd(), a = rnd()*2*Math.PI; out.push([.07*Math.cos(a) + .12*t*t, .72 + .3*t, .07*Math.sin(a)]); }   // tallo
      else if (q < .09){ out.push([gauss()*.18, -.05 + gauss()*.15, gauss()*.18]); }                                              // luz de la vela
      else if (q < .15){ for (let g = 0; g < 4000; g++){                                                                       // borde marcado de la cara
          const u = (rnd()*2-1)*.85, v = (rnd()*2-1)*.62;
          if (!carvedFace(u,v) && (carvedFace(u+D,v) || carvedFace(u-D,v) || carvedFace(u,v+D) || carvedFace(u,v-D))){ out.push(body(v, Math.PI/2 + u)); break; } } }
      else if (q < .45){ for (let g = 0; g < 4000; g++){                                                                       // ojos, nariz y boca encendidos por la vela
          const u = (rnd()*2-1)*.85, v = (rnd()*2-1)*.62;
          if (carvedFace(u,v)){ out.push(body(v, Math.PI/2 + u).map(c => c*.97)); break; } } }
      else { for (let g = 0; g < 100; g++){ const c = rnd()*2-1, a = rnd()*2*Math.PI, u = Math.atan2(Math.sin(a - Math.PI/2), Math.cos(a - Math.PI/2));
          if (Math.abs(u) < .85 && Math.abs(c) < .62 && carvedFace(u,c)) continue; out.push(body(c, a)); break; } }
    }
    return out;
  },
  hourglass(n){
    const out = [];
    for (let i = 0; i < n; i++){ const u = rnd(), a = rnd()*2*Math.PI;
      if (u < .5){ const y = rnd()*2 - 1, r = .12 + .6*y*y; out.push([r*Math.cos(a), y, r*Math.sin(a)]); }
      else if (u < .62){ const y = rnd() < .5 ? 1 : -1, r = .72 + gauss()*.006; out.push([r*Math.cos(a), y, r*Math.sin(a)]); }
      else if (u < .84){ const t = Math.sqrt(rnd()); out.push([.6*t*Math.cos(a), -.95 + .45*(1-t), .6*t*Math.sin(a)]); }
      else if (u < .9){ out.push([gauss()*.008, -.5 + rnd()*.5, gauss()*.008]); }
      else { const t = Math.sqrt(rnd()), y = .5 + .3*t; out.push([(.12 + .6*y*y)*.92*t*Math.cos(a), y, (.12 + .6*y*y)*.92*t*Math.sin(a)]); }
    }
    return out;
  },
  moon(n){
    const out = [], norm = v => { const l = Math.hypot(...v) || 1; return v.map(c => c/l); }, craters = [];
    for (let k = 0; k < 18; k++) craters.push([norm([gauss(), gauss(), gauss()]), .07 + rnd()*.2]);

      else { const r = q < .85 ? Math.sqrt(rnd())*R : R; out.push([s*G*nx[0] + r*Math.cos(t)*e1[0], s*G*nx[1] + r*Math.cos(t)*e1[1], r*Math.sin(t), 0, s < 0 ? 1 : 0]); }
    }
    return out;
  },
  torusSplit(n){     // dona partida en dos medias lunas
    const out = [], R0 = .65, r0 = .3, G = .1, P = (u, rr, v) => [(R0 + rr*Math.cos(v))*Math.cos(u), rr*Math.sin(v), (R0 + rr*Math.cos(v))*Math.sin(u)];
    for (let i = 0; i < n; i++){ const s = rnd() < .5 ? 1 : -1, v = rnd()*2*Math.PI;
      const p = rnd() < .66 ? P((s > 0 ? 0 : Math.PI) + (rnd() - .5)*Math.PI, r0, v) : P(rnd() < .5 ? Math.PI/2 : -Math.PI/2, Math.sqrt(rnd())*r0, v);
      out.push([p[0] + s*G, p[1], p[2], 0, s > 0 ? 0 : 1]);
    }
    return out;
  },
  coneSplit(n){      // cono invertido partido en dos
    const out = [], G = .1;
    for (let i = 0; i < n; i++){ const q = rnd(), s = rnd() < .5 ? -1 : 1, t = Math.sqrt(rnd()), g = s < 0 ? 1 : 0;
      if (q < .58){ const a = (rnd() - .5)*Math.PI, r = .85*t; out.push([s*(r*Math.cos(a) + G), -.9 + t*1.7, r*Math.sin(a), 0, g]); }
      else if (q < .9) out.push([s*G, -.9 + t*1.7, (rnd()*2 - 1)*.85*t, 0, g]);
      else { const a = (rnd() - .5)*Math.PI; out.push([s*(.85*Math.cos(a) + G), .8, .85*Math.sin(a), 0, g]); }
    }
    return out;
  },
  cylSplit(n){       // cilindro partido en dos
    const out = [], R = .55, Hh = .95, G = .1;
    for (let i = 0; i < n; i++){ const q = rnd(), s = rnd() < .5 ? -1 : 1, a = (rnd() - .5)*Math.PI, g = s < 0 ? 1 : 0;
      if (q < .55) out.push([s*(R*Math.cos(a) + G), (rnd()*2 - 1)*Hh, R*Math.sin(a), 0, g]);
      else if (q < .85) out.push([s*G, (rnd()*2 - 1)*Hh, (rnd()*2 - 1)*R, 0, g]);
      else out.push([s*(R*Math.cos(a) + G), rnd() < .5 ? -Hh : Hh, R*Math.sin(a), 0, g]);
    }
    return out;
  },
  halvesCounter(n){  // las dos mitades giran en sentidos opuestos y se atraviesan
    const out = [], R = .85, G = .12;
    for (let i = 0; i < n; i++){ const q = rnd(); let v;
      if (q < .3){ const m = Math.floor(rnd()*8)*Math.PI/4, t = rnd()*Math.PI; v = [Math.sin(t)*Math.cos(m), Math.cos(t), Math.sin(t)*Math.sin(m)]; }
      else v = norm3([gauss(), gauss(), gauss()]);
      if (q < .75){ const l = v[0] < 0; out.push([v[0]*R + (l ? -G : G), v[1]*R, v[2]*R, 0, l ? 1 : 0, l ? 1 : -1]); }
      else { const s = rnd() < .5 ? -1 : 1, a = rnd()*2*Math.PI, r = Math.sqrt(rnd())*R; out.push([s*G, r*Math.cos(a), r*Math.sin(a), 0, s < 0 ? 1 : 0, s < 0 ? 1 : -1]); }
    }
    return out;
  },
  shellsCounter(n){  // tres cáscaras que giran, una al revés de la otra
    const out = [], SH = [[.92, 1, 1], [.66, 0, -1], [.4, 1, 2]];
    for (let i = 0; i < n; i++){ const u = rnd(), s = SH[u < .5 ? 0 : u < .82 ? 1 : 2]; let v;
      if (rnd() < .5){ const m = Math.floor(rnd()*12)*Math.PI/6, t = rnd()*Math.PI; v = [Math.sin(t)*Math.cos(m), Math.cos(t), Math.sin(t)*Math.sin(m)]; }
      else v = norm3([gauss(), gauss(), gauss()]);
      out.push([v[0]*s[0], v[1]*s[0], v[2]*s[0], 0, s[1], s[2]]);
    }
    return out;
  },
  cubesCounter(n){   // un cubo chico adentro de otro, girando al revés
    const out = [], ed = [], CB = [[.8, 1, 1], [.46, 0, -1]];
    for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]){ const p = [x, y, z]; for (let k = 0; k < 3; k++) if (p[k] < 0){ const q = [...p]; q[k] = 1; ed.push([p, q]); } }
    for (let i = 0; i < n; i++){ const [H, g, sp] = CB[rnd() < .6 ? 0 : 1];
      if (rnd() < .72){ const [a, b] = ed[Math.floor(rnd()*12)], u = rnd(); out.push([0, 1, 2].map(k => (a[k] + (b[k] - a[k])*u)*H).concat([0, g, sp])); }
      else { const k = Math.floor(rnd()*3), p = [0, 0, 0]; p[k] = rnd() < .5 ? -H : H; p[(k+1) % 3] = (rnd()*2 - 1)*H; p[(k+2) % 3] = (rnd()*2 - 1)*H; out.push([...p, 0, g, sp]); }
    }
    return out;
  },
  slices(n){         // esfera en rodajas: cada disco gira al revés del de al lado
    const out = [], R = .88;
    for (let i = 0; i < n; i++){ const k = Math.floor(rnd()*7), y = -.78 + k*.26, r = Math.sqrt(Math.max(.02, R*R - y*y)), a = rnd()*2*Math.PI, q = rnd(); let p;
      if (q < .35){ const m = Math.floor(rnd()*12)*Math.PI/6, rr = Math.sqrt(rnd())*r; p = [rr*Math.cos(m), y, rr*Math.sin(m)]; }
      else if (q < .55) p = [r*Math.cos(a), y, r*Math.sin(a)];
      else { const rr = Math.sqrt(rnd())*r; p = [rr*Math.cos(a), y, rr*Math.sin(a)]; }
      out.push([...p, 0, k % 2, k % 2 ? -1 : 1]);
    }
    return out;
  },
  helix(n){
    const out = [];
    for (let i = 0; i < n; i++){ const s = i % 3, y = rnd()*2 - 1, a = y*3*Math.PI;
      if (s < 2) out.push([Math.cos(a + s*Math.PI)*.5, y, Math.sin(a + s*Math.PI)*.5, 0, s]);
      else { const b = Math.round(y*8)/8, ab = b*3*Math.PI, u = rnd()*2 - 1; out.push([Math.cos(ab)*.5*u, b, Math.sin(ab)*.5*u, 0, u > 0 ? 1 : 0]); }   // peldaños mitad y mitad
    }
    return out;
  },
};

let SPIN = new Float32Array(0), FIX = new Uint8Array(0), GX = new Float32Array(0), GY = GX, GR = GX, GA = GX, stars = [], starKey = '', spriteKey = '', sprites = [];
function ensureStars(){
  const n = +$('e').value, key = n + ':' + seedBase; if (key === starKey) return; starKey = key;
  let s = seedBase*7919 + 13; const r = () => (s = (s*16807) % 2147483647) / 2147483647;
  stars = Array.from({length: n}, () => [r()*W, r()*H, .15 + .6*r()*r(), r() < .15 ? 3 : 2]);
}
function getSprites(cols){
  const key = cols.join('|'); if (key === spriteKey) return sprites; spriteKey = key;
  sprites = cols.map(c => { const k = document.createElement('canvas'); k.width = k.height = 64; const g = k.getContext('2d'),
      gr = g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0, c.replace('rgb','rgba').replace(')',',.3)')); gr.addColorStop(1, c.replace('rgb','rgba').replace(')',',0)'));
    g.fillStyle = gr; g.fillRect(0,0,64,64); return k; });
  return sprites;
}
function build(){
  seed = seedBase; const raw = shapes[$('shape').value](+$('n').value);
  // el color va pegado al objeto: por altura, o del centro al borde si la figura es plana
  let lo = Infinity, hi = -Infinity; for (const p of raw){ lo = Math.min(lo,p[1]); hi = Math.max(hi,p[1]); }
  const grp = raw.length && raw[0][4] !== undefined, radial = !grp && ['blackHole','galaxy'].includes($('shape').value), flat = !grp && (radial || hi - lo < .5),
    key = p => grp ? p[4] : radial ? 1 - Math.min(1, Math.hypot(p[0],p[1],p[2])) : flat ? 1 - Math.hypot(p[0],p[2]) : p[1];
  if (flat || grp){ lo = Infinity; hi = -Infinity; for (const p of raw){ lo = Math.min(lo,key(p)); hi = Math.max(hi,key(p)); } }
  const bk = p => Math.min(NB-1, Math.floor((key(p)-lo)/((hi-lo)||1)*NB));
  raw.sort((p,q) => bk(p)-bk(q)); pts = raw; bks = raw.map(bk);
  FIX = Uint8Array.from(pts, p => p[3] === 1 ? 1 : 0); SPIN = Float32Array.from(pts, p => p[5] === undefined ? 1 : p[5]); GX = new Float32Array(pts.length); GY = new Float32Array(pts.length); GR = new Float32Array(pts.length); GA = new Float32Array(pts.length);   // agrupados por color para pintar rápido
}
let seedBase = 7;
const PALETAS = {
  'Clásico':     {bg:'#000000', tx:'#ffffff', a:'#ffffff', b:'#ffffff'},
  'Azul':        {bg:'#000000', tx:'#dbe7ff', a:'#8fb4ff', b:'#2f5bff'},
  'Rojo y azul': {bg:'#000000', tx:'#ffffff', a:'#ff2d3d', b:'#2d6bff'},
  'Oro y violeta':{bg:'#000000', tx:'#ffe9b0', a:'#ffc83d', b:'#6a4cff'},
  'Fuego':       {bg:'#060200', tx:'#ffe2b8', a:'#ffd24a', b:'#ff4a1c'},
  'Hielo':       {bg:'#000308', tx:'#eaf6ff', a:'#ffffff', b:'#6fc3ff'},
  'Rosa':        {bg:'#05020a', tx:'#ffe3f4', a:'#ff8fd0', b:'#7c5cff'},
  'Esmeralda':   {bg:'#000805', tx:'#dcffee', a:'#9dffd0', b:'#12b886'},
  'Cian':        {bg:'#00080b', tx:'#e0ffff', a:'#7cf8ff', b:'#2a7bff'},
  'Plata':       {bg:'#000000', tx:'#ffffff', a:'#ffffff', b:'#8fa0b8'},
  'Halloween':   {bg:'#0a0500', tx:'#ffd9a0', a:'#ffb347', b:'#ff5e00'},
  'Navidad':     {bg:'#04100a', tx:'#ffffff', a:'#ff5a5a', b:'#3ddc84'},
  'USA':         {bg:'#040818', tx:'#ffffff', a:'#ff4155', b:'#2f6bff'}
};
function applyPalette(p){
  $('cbg').value = p.bg; $('ctt').value = p.tx; $('ca').value = p.a; $('cb').value = p.b; $('grad').checked = p.a !== p.b;
}
for (const [name, p] of Object.entries(PALETAS)){
  const b = document.createElement('button'); b.type = 'button'; b.textContent = name;
  b.style.borderLeftColor = p.a; b.onclick = () => applyPalette(p); $('presets').appendChild(b);
}
const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const NB = 24; let bks = [];
function colores(){
  const A = hex2rgb($('ca').value), B = $('grad').checked ? hex2rgb($('cb').value) : A;
  return Array.from({length: NB}, (_,k) => { const t = k/(NB-1);   // k=0 es lo más bajo: color B
    return 'rgb(' + A.map((c,i) => Math.round(B[i] + (c-B[i])*t)).join(',') + ')'; });
}


function wrap(text, max){
  const words = text.split(/\s+/), lines = []; let cur = '';
  for (const w of words){ const t = cur ? cur+' '+w : w;
    if (ctx.measureText(t).width > max && cur){ lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}

function draw(){
  ctx.fillStyle = $('cbg').value; ctx.fillRect(0,0,W,H);
  const cols = colores(); ensureStars();
  ctx.fillStyle = $('ctt').value; for (const st of stars){ ctx.globalAlpha = st[2]; ctx.fillRect(st[0], st[1], st[3], st[3]); }
  const tilt = +$('t').value*Math.PI/180, size = +$('s').value, dep = +$('d').value/100;
  const R = W*(+$('z').value/100), cy = H*0.47;
  const ca = Math.cos(angle), sa = Math.sin(angle), ct = Math.cos(tilt), st = Math.sin(tilt);
  let last = -1;
  for (let i = 0; i < pts.length; i++){
    const [x,y,z] = pts[i];
    if (bks[i] !== last){ last = bks[i]; ctx.fillStyle = cols[last]; }
    const fx = FIX[i], sp = SPIN[i], cc = sp === 1 ? ca : Math.cos(angle*sp), ss = sp === 1 ? sa : Math.sin(angle*sp), x1 = fx ? x : x*cc + z*ss, z1 = -x*ss + z*cc;          // giro sobre el eje vertical (los puntos fijos no giran)
    const y2 = fx ? y : y*ct - z1*st, z2 = fx ? 0 : y*st + z1*ct;             // inclinación de cámara
    // proyección ortogonal: sin perspectiva, el punto de atrás se ve igual que el de adelante
    const k = 1 + dep*0.6*z2, a = 1 - dep*0.7*(1 - z2)/2;
    ctx.globalAlpha = Math.max(.08, Math.min(1, a));
    const r = size*k*(W/1080)*1.2;
    ctx.fillRect(W/2 + x1*R - r/2, cy - y2*R - r/2, r, r);
    GX[i] = W/2 + x1*R; GY[i] = cy - y2*R; GR[i] = r; GA[i] = ctx.globalAlpha;
  }
  const glow = +$('b').value/100;
  if (glow > 0){                                            // halo suave: un sprite radial por color, sumado a la imagen
    const sp = getSprites(cols); ctx.globalCompositeOperation = 'lighter'; last = -1;
    for (let i = 0; i < pts.length; i++){ const s = GR[i]*7;
      ctx.globalAlpha = Math.min(1, glow*.4*GA[i]); ctx.drawImage(sp[bks[i]], GX[i] - s/2, GY[i] - s/2, s, s); }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = $('ctt').value; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = '600 52px ui-monospace,Menlo,Consolas,monospace';
  wrap($('top').value, W*0.8).forEach((l,i) => ctx.fillText(l, W/2, 200 + i*72));
  ctx.font = 'italic 40px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillText($('bot').value, W/2, H - 330);
}

function frame(now){
  const dt = Math.min(0.1, (now-last)/1000); last = now;
  const dir = $('rev').checked ? -1 : 1;
  angle += dir * (+$('v').value/60)*2*Math.PI*dt;
  draw(); requestAnimationFrame(frame);
}

function labels(){
  $('vN').textContent = $('n').value; $('vS').textContent = $('s').value;
  $('vV').textContent = $('v').value; $('vT').textContent = $('t').value+'°';
  $('vD').textContent = $('d').value+'%'; $('vB').textContent = $('b').value+'%'; $('vE').textContent = $('e').value; $('vZ').textContent = $('z').value+'%';
  $('vR').textContent = $('r').value+' s';
}
['n','shape','word'].forEach(i => $(i).addEventListener('input', () => { build(); labels(); }));
if (document.fonts && document.fonts.load) document.fonts.load('800 100px Poppins').then(() => { if ($('shape').value === 'text3d') build(); }).catch(() => {});
['s','v','t','d','z','r','b','e'].forEach(i => $(i).addEventListener('input', labels));
$('rnd').onclick = () => {
  const o = $('shape').options, p = Object.values(PALETAS);
  $('shape').selectedIndex = Math.floor(Math.random()*o.length); applyPalette(p[Math.floor(Math.random()*p.length)]);
  seedBase = Math.floor(Math.random()*1e6) + 1; build();
};
$('reseed').onclick = () => { seedBase = Math.floor(Math.random()*1e6)+1; build(); };

const PYFORMA = {sphere:'esfera',cylinder:'cilindro',cube:'cubo',torus:'toro',helix:'helice',cone:'cono',pyramid:'piramide',coneInv:'cono_invertido',galaxy:'galaxia',tornado:'tornado',saturn:'saturno',blackHole:'agujero_negro',pumpkin:'calabaza',hourglass:'reloj_arena',moon:'luna',tesseract:'teseracto',coil:'bobina',sierpinski:'sierpinski',football:'futbol_americano',basketball:'baloncesto',soccer:'futbol',ufo:'ovni',rocket:'cohete',star:'estrella',snowflake:'copo',tree:'arbol_navidad',ghost:'fantasma',skull:'calavera',web:'telarana',text3d:'texto3d',gem:'joya',flag:'bandera',snowman:'muneco_nieve',candyCane:'baston_caramelo',dice:'dado',coin:'moneda',fibSphere:'esfera_fibonacci',jellyfish:'medusa',butterfly:'mariposa',world:'planeta',oak:'arbol_fractal',comet:'cometa',nebula:'nebulosa',plasma:'plasma',burst:'explosion',halves:'mitades',bowls:'cuencos',cutplanet:'planeta_cortado',slicedTorus:'toro_cortado',cubeSphere:'esfera_en_cubo',cubeDots:'cubo_puntos',cubeSplit:'cubo_partido',sphereDiag:'esfera_diagonal',torusSplit:'toro_partido',coneSplit:'cono_partido',cylSplit:'cilindro_partido',halvesCounter:'mitades_contrarias',shellsCounter:'esferas_contrarias',cubesCounter:'cubos_contrarios',slices:'rodajas',voxels:'cubitos',nestedCones:'conos_anidados'};
$('rec').onclick = async () => {
  const sel = $('shape'), nombre = sel.options[sel.selectedIndex].text;
  const pal = Object.entries(PALETAS).find(([,p]) => p.bg === $('cbg').value && p.tx === $('ctt').value && p.a === $('ca').value && p.b === $('cb').value);
  const t = [
    'PEDIDO DE VIDEO',
    'Forma: ' + nombre + ' (' + PYFORMA[sel.value] + ')',
    'Puntos: ' + $('n').value + ' | Tamaño: ' + $('s').value,
    'Velocidad: ' + $('v').value + ' vueltas/min | Sentido: ' + ($('rev').checked ? 'al revés' : 'normal'),
    'Inclinación: ' + $('t').value + '° | Profundidad: ' + $('d').value + '% | Figura: ' + $('z').value + '%',
    'Paleta: ' + (pal ? pal[0] : 'a medida') + ' | Fondo ' + $('cbg').value + ' | Texto ' + $('ctt').value,
    'Puntos arriba ' + $('ca').value + ' | abajo ' + $('cb').value + ' | Degradado: ' + ($('grad').checked ? 'sí' : 'no'),
    'Texto de arriba: ' + ($('top').value.trim() || '(sin texto)'),
    'Texto de abajo: ' + ($('bot').value.trim() || '(sin texto)'),
    ...(sel.value === 'text3d' ? ['Palabra: ' + $('word').value] : []),
    'Brillo: ' + $('b').value + '% | Estrellas de fondo: ' + $('e').value,
    'Duración: ' + $('r').value + ' s | ' + '30 fps | Versión (semilla): ' + seedBase
  ].join('\n');
  const box = $('pedido'); box.hidden = false; box.value = t; box.rows = t.split('\n').length + 1;
  try { await navigator.clipboard.writeText(t); $('msg').textContent = 'Copiado. Pegámelo en el chat y te mando el video en calidad completa.'; }
  catch (e) { box.focus(); box.select(); $('msg').textContent = 'Mantené apretado el texto, copialo y pegámelo en el chat.'; }
};

build(); labels(); requestAnimationFrame(frame);
</script>
